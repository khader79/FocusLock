<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>FocusLock — تحدي</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0b0b0f;
        color: #eee;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        width: min(720px, 92vw);
        background: #15151c;
        border: 1px solid #2a2a33;
        border-radius: 16px;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .timer { color: #6f6f7a; font-variant-numeric: tabular-nums; }
      h1 { margin: 0; font-size: 18px; }
      button {
        background: transparent;
        color: #6f6f7a;
        border: 1px solid #2a2a33;
        border-radius: 10px;
        padding: 6px 16px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { color: #eee; }
      .progress { height: 4px; border-radius: 2px; background: #2a2a33; overflow: hidden; }
      .progress > div { height: 100%; background: #7c5cff; transition: width 0.15s; }
      .target {
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 19px;
        line-height: 1.6;
        letter-spacing: 0.5px;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: none;
        max-height: 280px;
        overflow: auto;
        padding: 4px;
      }
      .muted { color: #6f6f7a; }
      .correct { color: #3ddc84; }
      .error { color: #ff5252; }
      textarea {
        width: 100%;
        min-height: 110px;
        resize: none;
        background: #0b0b0f;
        color: #eee;
        border: 1px solid #2a2a33;
        border-radius: 10px;
        padding: 12px 14px;
        font-family: "JetBrains Mono", "Consolas", monospace;
        font-size: 17px;
        line-height: 1.6;
        caret-color: #7c5cff;
        outline: none;
      }
      textarea:disabled { opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="topbar">
        <span class="timer" id="timer">--:--</span>
        <h1>أكمل التحدي 🔒</h1>
        <button id="cancel">إلغاء</button>
      </div>
      <div class="progress"><div id="bar" style="width: 0%"></div></div>
      <div class="target" id="target"></div>
      <textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    </div>
    <script>
      'use strict'

      const api = window.challengeModal
      const root = document.getElementById('target')
      const input = document.getElementById('input')
      const bar = document.getElementById('bar')
      const timerEl = document.getElementById('timer')
      const cancelBtn = document.getElementById('cancel')

      let text = ''
      let expiresAt = 0
      let finished = false
      let timerId = 0

      function diffIndex(typed, target) {
        const max = Math.min(typed.length, target.length)
        for (let i = 0; i < max; i++) {
          if (typed[i] !== target[i]) return i
        }
        if (typed.length === target.length) return -1
        return typed.length > target.length ? target.length : typed.length
      }

      function blockEvent(event) {
        event.preventDefault()
      }

      function render() {
        const errorAt = diffIndex(input.value, text)
        root.textContent = ''

        for (let i = 0; i < text.length; i++) {
          const char = document.createElement('span')
          if (errorAt === -1 && i < input.value.length) {
            char.className = 'correct'
          } else if (i < errorAt) {
            char.className = 'correct'
          } else if (i === errorAt) {
            char.className = 'error'
          } else {
            char.className = 'muted'
          }
          char.textContent = text[i]
          root.appendChild(char)
        }

        const progress = errorAt === -1 ? 1 : Math.max(0, errorAt / text.length)
        bar.style.width = `${(progress * 100).toFixed(1)}%`

        if (errorAt === -1) {
          complete()
        }
      }

      function formatTime(millis) {
        const total = Math.max(0, Math.ceil(millis / 1000))
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`
      }

      function tick() {
        const remaining = expiresAt - Date.now()
        timerEl.textContent = formatTime(remaining)
        if (remaining <= 0) {
          clearInterval(timerId)
          void api.cancel()
        }
      }

      function complete() {
        if (finished) return
        finished = true
        clearInterval(timerId)
        input.disabled = true
        void api.submit(text)
      }

      input.addEventListener('input', render)
      input.addEventListener('paste', blockEvent)
      input.addEventListener('copy', blockEvent)
      input.addEventListener('cut', blockEvent)
      input.addEventListener('contextmenu', blockEvent)
      input.addEventListener('drop', blockEvent)
      input.addEventListener('keydown', function (event) {
        if (event.ctrlKey || event.metaKey) {
          if ('vcxazy'.indexOf(event.key.toLowerCase()) !== -1) {
            event.preventDefault()
          }
        }
      })

      cancelBtn.addEventListener('click', function () {
        void api.cancel()
      })

      void api.getData().then(function (data) {
        if (!data || typeof data.text !== 'string' || typeof data.expiresAt !== 'number') {
          void api.cancel()
          return
        }
        text = data.text
        expiresAt = data.expiresAt
        input.maxLength = text.length
        render()
        tick()
        timerId = setInterval(tick, 1000)
        input.focus()
      })
    </script>
  </body>
</html>
